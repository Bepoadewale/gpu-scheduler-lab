name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=9.0.3,<10' 'ruff>=0.8,<1'
      - run: PYTHONPATH=scheduler-lab/src python -m ruff check scheduler-lab/src tests
      - run: PYTHONPATH=scheduler-lab/src python -m pytest -q

  kind-integration:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: helm/kind-action@v1.12.0
      - run: make install
      - run: make bootstrap-local
      - run: make smoke
      - run: make demo-kueue
      - run: make demo-fair-share
      - run: make demo-preemption
      - run: make demo-starvation
      - run: make demo-gang
      - run: make verify
      - if: always()
        run: make clean-local
