name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: PYTHONPATH=scheduler-lab/src python -m ruff check scheduler-lab/src tests
      - run: PYTHONPATH=scheduler-lab/src python -m pytest -q
